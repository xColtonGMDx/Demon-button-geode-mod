name: Build Geode Mod
#UwU
on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@v1
        with:
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - uses: geode-sdk/build-geode-mod/combine@v1
        id: build
        with:
          platforms: windows,macos,android32,android64

      - name: Pack mod
        uses: geode-sdk/build-geode-mod/pack@v1
        with:
          input: ${{ steps.build.outputs.build-output }}

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
